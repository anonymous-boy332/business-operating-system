<section class="business-stats" aria-label="Live business metrics">
    <article class="business-stat-card">
        <div class="stat-icon" aria-hidden="true">💰</div>
        <div class="stat-content"><p>Recorded income</p><h3 id="biIncomeTotal">—</h3><span id="biIncomeNote">From saved finance records</span></div>
    </article>
    <article class="business-stat-card">
        <div class="stat-icon" aria-hidden="true">↗</div>
        <div class="stat-content"><p>Paid expenses</p><h3 id="biExpenseTotal">—</h3><span id="biExpenseNote">From saved finance records</span></div>
    </article>
    <article class="business-stat-card">
        <div class="stat-icon" aria-hidden="true">⇄</div>
        <div class="stat-content"><p>Net cash flow</p><h3 id="biNetCashflow">—</h3><span id="biNetNote">Income less paid expenses, by currency</span></div>
    </article>
    <article class="business-stat-card">
        <div class="stat-icon" aria-hidden="true">🛒</div>
        <div class="stat-content"><p>Sales orders</p><h3 id="biOrderCount">—</h3><span id="biOrderNote">From saved customer orders</span></div>
    </article>
    <article class="business-stat-card">
        <div class="stat-icon" aria-hidden="true">👥</div>
        <div class="stat-content"><p>Customers</p><h3 id="biCustomerCount">—</h3><span id="biCustomerNote">Saved CRM records</span></div>
    </article>
    <article class="business-stat-card">
        <div class="stat-icon" aria-hidden="true">📦</div>
        <div class="stat-content"><p>Products on file</p><h3 id="biProductCount">—</h3><span id="biProductNote">Saved inventory records</span></div>
    </article>
    <p class="bi-data-status" id="businessIntelligenceStatus" role="status" aria-live="polite"></p>
</section>
