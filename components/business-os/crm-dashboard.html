<section class="crm-dashboard">
    <div class="section-header crm-dashboard-header">
        <div>
            <span class="crm-eyebrow">CUSTOMER RELATIONSHIPS</span>
            <h2>CRM Dashboard</h2>
            <p id="crmDashboardDataNote">Live counts from your saved customer directory and activity history.</p>
        </div>
        <div class="crm-dashboard-actions">
            <button type="button" class="primary-btn" data-crm-action="add-customer">+ Add customer</button>
            <button type="button" class="crm-action-btn crm-directory-cta" data-crm-dashboard-action="directory">Customer directory</button>
        </div>
    </div>

    <div class="crm-grid">
        <article class="crm-card">
            <span class="crm-card-icon" aria-hidden="true">👥</span>
            <h3 id="crmDashboardCustomers">0</h3>
            <p>Saved customers</p>
        </article>
        <article class="crm-card">
            <span class="crm-card-icon" aria-hidden="true">✓</span>
            <h3 id="crmDashboardActive">0</h3>
            <p>Active customers</p>
        </article>
        <article class="crm-card">
            <span class="crm-card-icon" aria-hidden="true">✦</span>
            <h3 id="crmDashboardNew">0</h3>
            <p>Added this month</p>
        </article>
        <article class="crm-card">
            <span class="crm-card-icon" aria-hidden="true">◷</span>
            <h3 id="crmDashboardActivities">0</h3>
            <p>Recorded activities</p>
        </article>
    </div>
</section>
